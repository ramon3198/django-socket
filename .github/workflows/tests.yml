name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Django 4.2 no soporta Python 3.13, y 6.x no soporta 3.10.
        include:
          - {python: "3.10", django: "4.2"}
          - {python: "3.11", django: "5.0"}
          - {python: "3.12", django: "5.1"}
          - {python: "3.13", django: "5.2"}
          - {python: "3.13", django: "6.1"}

    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Instalar
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,redis]"
          pip install "django~=${{ matrix.django }}.0"

      - name: Version en uso
        run: python -c "import django, sys; print(django.get_version(), sys.version)"

      - name: Tests
        run: pytest -q

      - name: Cobertura
        if: matrix.django == '6.1'
        run: |
          pip install coverage
          coverage run --source=django_socket -m pytest -q
          coverage report --fail-under=90

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Sin `npm install`: el cliente se prueba con el runner que trae Node.
      - run: node --test tests/js/*.test.js

  integracion:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: |
          python -m pip install -U pip
          pip install -e ".[dev,redis]"
      - name: Contra un servidor de verdad
        run: |
          python manage.py migrate --noinput
          python manage.py runserver 8000 --noreload &
          sleep 6
          python test_sockets.py 8000
      - name: Fan-out entre dos procesos via Redis
        run: |
          DJANGO_SOCKET_LAYER=redis python manage.py runserver 8091 --noreload &
          DJANGO_SOCKET_LAYER=redis python manage.py runserver 8092 --noreload &
          sleep 8
          python test_multiproceso.py 8091 8092
