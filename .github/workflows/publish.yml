# Publica en PyPI al crear una release en GitHub.
#
# Usa Trusted Publishing (OIDC): PyPI confia en este repositorio concreto y en
# este workflow, asi que NO hay token que guardar, rotar ni filtrar. Hay que
# darlo de alta una sola vez en https://pypi.org/manage/account/publishing/
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:        # tambien a mano, para probar contra TestPyPI

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}

      - name: Construir
        run: |
          python -m pip install -U pip build twine
          python -m build
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    # Solo en releases de verdad; el disparo manual se queda en TestPyPI.
    if: github.event_name == 'release'
    environment:
      name: pypi
      url: https://pypi.org/p/django-socket
    permissions:
      id-token: write       # lo que hace posible el Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - uses: pypa/gh-action-pypi-publish@release/v1

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: testpypi
      url: https://test.pypi.org/p/django-socket
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
